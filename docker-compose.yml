version: '3.8'

services:
  app:
    build: .
    image: person-detection-app
    container_name: person-detection

    # Shared memory for PyTorch / DataLoader
    shm_size: "8gb"

    # Persist results to host
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./config:/app/config

    # Environment
    environment:
      PYTHONUNBUFFERED: "1"

    # Keep container alive only if debugging
    tty: true
