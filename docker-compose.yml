version: '3.8'

services:
  app:
    build: .
    container_name: person-detection
    volumes:
      # Mount local directories to container
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./src:/app/src
      - ./config:/app/config
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    stdin_open: true
    tty: true
    shm_size: '8gb' # Increase shared memory for data loading
