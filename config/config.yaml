# Configuration for Person Detection

# Dataset Configuration
dataset                   : 
  class_name              : "Person"
  total_images            : 1500
  train_split             : 0.7 # 70% for training
  val_split               : 0.15 # 15% for validation
  test_split              : 0.15 # 15% for testing

# Data Quality Thresholds
quality                   : 
  min_brightness          : 30 # Minimum average brightness (0-255)
  max_brightness          : 225 # Maximum average brightness
  min_contrast            : 20 # Minimum contrast threshold
  blur_threshold          : 100 # Laplacian variance threshold for sharpness
  min_bbox_area           : 400 # Minimum bounding box area (pixels)

# Image Enhancement Parameters
enhancement               : 
  brightness_adjustment   : true
  contrast_adjustment     : true
  sharpening              : true
  clahe_clip_limit        : 2.0
  clahe_grid_size         : [8, 8]

# Model Training Configuration
training                  : 
  model                   : "yolov8n.pt" # YOLOv8 nano (fastest)
  # Alternative: "yolov8s.pt" (small), "yolov8m.pt" (medium)

  epochs                  : 100
  batch_size              : 16
  img_size                : 640
  patience                : 20 # Early stopping patience

  # Hyperparameters
  learning_rate           : 0.01
  momentum                : 0.937
  weight_decay            : 0.0005

  # Data Augmentation
  augment                 : true
  hsv_h                   : 0.015 # HSV-Hue augmentation
  hsv_s                   : 0.7 # HSV-Saturation augmentation
  hsv_v                   : 0.4 # HSV-Value augmentation
  degrees                 : 0.0 # Rotation
  translate               : 0.1 # Translation
  scale                   : 0.5 # Scale
  flipud                  : 0.0 # Flip up-down
  fliplr                  : 0.5 # Flip left-right
  mosaic                  : 1.0 # Mosaic augmentation

# Evaluation Configuration
evaluation                : 
  conf_threshold          : 0.25 # Confidence threshold
  iou_threshold           : 0.45 # IoU threshold for NMS

# Paths
paths                     : 
  raw_data                : "data/raw"
  processed_data          : "data/processed"
  models                  : "models"
  results                 : "results"
